ernestdefoe-garrison:

  api:
    errors:
      unknown_verb: That is not something Garrison can ask a server to do.
      not_permitted: You do not have permission to do that to this server.
      name_required: Give the host a name.
      needs_pro: That is part of Garrison Pro. This forum is running the free edition, which covers one host and one server.
      host_limit: "The free edition of Garrison covers {max} host. Garrison Pro removes the limit."
      upload_failed: That file did not arrive. Try again.
      not_an_image: That is not an image Garrison can use. PNG, JPEG, GIF or WebP.
      too_large: That image is over 512 KB. Use a smaller one.
      no_artwork: Garrison does not know where to find artwork for this game. Upload an image instead.
      fetch_failed: Could not fetch that image. Upload one instead.
      not_a_url: That is not a web address.
      bad_scheme: Only http and https addresses can be fetched.
      unresolvable: That address does not resolve to anything.
      private_address: That address points inside this network, so Garrison will not fetch it.

      # 🚨 Every one of these is a refusal somebody can ACT on, and each points
      # at a different next step. A single "something went wrong" would make
      # all of them look like a broken panel.
      bad_player_name: That does not look like an in-game name.
      player_taken: Somebody has already proved that this is their character on this server.
      code_expired: That code has expired. Ask for a new one.
      code_wrong: That code is not right. Check it in the game and try again.
      code_too_soon: A code was just sent. Check the game, or wait a moment and try again.

  # 🚨 Email copy, and the one place in this file where a mistake cannot be
  # taken back — a forum post can be edited, a sent email cannot. The subject
  # names the server, because this is read on a lock screen.
  email:
    server_incident:
      subject:
        down: "{name} is down"
        unready: "{name} stopped accepting players"
        recovered: "{name} is back up"
        abandoned: "{name} still needs a hand"
      # 🚨 ONE body per state, shared by the plain and HTML templates.
      #
      # The HTML view renders this same text through Flarum's own formatter,
      # which turns the blank lines into paragraphs and the bare URL into a
      # link. Writing HTML here instead would not work — the formatter parses
      # forum markup, not markup you hand it — and two copies of the same
      # sentence is how a copy fix lands in one of them.
      body:
        down: |-
          {name} is not running, and Garrison could not get it started again.

          {url}
        unready: |-
          {name} is running, but players cannot get in. Garrison noticed because its health checks stopped passing, not because the process stopped — from the outside it still looks fine.

          {url}
        recovered: |-
          {name} is accepting players again. Nothing else is needed.

          {url}
        abandoned: |-
          Garrison has restarted {name} several times and it keeps failing the same way, so it has stopped trying rather than restart it in a loop. It needs somebody to look at it.

          {url}
        finding: "What the health check saw: {finding}"

  # 🚨 What gets posted to Discord. Translated like everything else: this is
  # the message that reaches a phone, so it is the one a community is most
  # likely to see, and it used to be the only hardcoded English in the product.
  webhook:
    unready: "⚠️ **{name}** is running but players cannot join. {url}"
    down: "🔴 **{name}** has stopped. {url}"
    recovered: "✅ **{name}** is back. {url}"
    abandoned: "🚨 **{name}** did not come back after repeated restarts. Automatic restarts have stopped and it needs a person. {url}"
    unknown: "**{name}**: {state}. {url}"

  forum:
    # The notification component reads these. The state is mapped to a key
    # through a closed switch rather than interpolated, so an unexpected state
    # can never ask for a key that does not exist.
    notification:
      down: "{name} is down"
      unready: "{name} stopped accepting players"
      recovered: "{name} is back"
      abandoned: "Garrison has stopped trying to fix {name}"

    settings:
      # 🚨 The label on the checkbox in a user's own notification preferences.
      # The key is `notify_<blueprint type>_label` — the type verbatim,
      # camelCase and all. Without this row the checkbox renders its raw key,
      # and without the grid entry in index.js there is no checkbox at all:
      # the preference exists and nothing can change it.
      notify_garrisonServerIncident_label: A game server I help run needs attention

    # 🚨 Every user-facing string lives here. Zero hardcoded English anywhere
    # in PHP or JS — a community running in German must get a German panel.
    title: Game servers
    state:
      running: Running
      stopped: Stopped
      starting: Starting
      stopping: Stopping
      crashed: Crashed
      unknown: Unknown
    stale: "Last heard from {when}"
    stale_short: Not reporting
    players: "{count, plural, one {# player} other {# players}} online"
    no_servers: No game servers are set up yet.
    unreachable: Could not reach the forum for server status.
    join_hidden: Join details are not shown to your group.
    widget_heading: Heading
    see_all: All servers
    join: How to join
    join_address_placeholder: the server address
    join_no_details: Your community has not published an address for this server yet. Ask whoever runs it.
    join_usual_port: "Usually port {port}, unless it was changed."

    # 🚨 One per game, because "how do I join" has a different answer in every
    # one of them and the address on its own helps nobody who has not done it
    # before. {address} is the operator's own join address when they published
    # one; the string still reads correctly without it.
    connect:
      valheim: "In Valheim: Join Game → Join IP, then enter {address}. The server password is separate from your character."
      minecraft: "In Minecraft: Multiplayer → Add Server, then enter {address}."
      minecraft-bedrock: "In Minecraft: Play → Servers → Add Server, then enter {address}."
      palworld: "In Palworld: Join Multiplayer Game, then enter {address}."
      rust: "In Rust: press F1 for the console and type client.connect {address}"
      ark: "In ARK: Join ARK, then find the server by name — or add {address} to your Steam favourites first."
      cs2: "In Counter-Strike 2: open the console with ~ and type connect {address}"
      satisfactory: "In Satisfactory: Server Manager → Add Server, then enter {address}."
      factorio: "In Factorio: Multiplayer → Connect to address, then enter {address}."
      7dtd: "In 7 Days to Die: Join a Game → Connect to IP, then enter {address}."
      projectzomboid: "In Project Zomboid: Join, then enter {address}."
      terraria: "In Terraria: Multiplayer → Join via IP, then enter {address}."
      enshrouded: "In Enshrouded: Play → Join via IP, then enter {address}."
      vrising: "In V Rising: Play → Online Play → Direct Connect, then enter {address}."
      dayz: "In DayZ: add {address} to your Steam favourites, then join from the in-game browser."
      gmod: "In Garry's Mod: open the console with ~ and type connect {address}"
    join_code: "Join code {code}"
    action_failed: That did not work. Try again in a moment.
    console: Console
    console_empty: Nothing here yet. Output appears as the server produces it.
    console_placeholder: Type a command for the server
    console_send: Send
    confirm_stop: "Stop {name}? Anybody playing will be disconnected."

    health:
      unready: Players cannot join
      unready_short: Cannot join
      attention: Needs attention
      attention_detail: Garrison restarted this server and it did not come back. Automatic restarts have stopped.
      attention_short: Needs you
      unchecked: Not checked — no readiness probes are set up for this game.

    action:
      start: Start
      stop: Stop
      restart: Restart

    fact:
      players: Players
      cpu: CPU
      memory: Memory
      uptime: Started
      driver: Runs as
      game: Game

    # The per-server page.
    back_to_all: All servers
    server_not_here: That server is not here. It may have been removed, or its host may not be paired any more.
    join_address: Address
    join_password: Password
    join_code_label: Join code

    # 🚨 `config`, NOT `settings`. Flarum reserves `forum.settings.*` for the
    # rows on a USER's own settings page — this extension already has one there
    # for the notification preference — and a second `settings:` block under
    # the same parent is a DUPLICATE KEY, which makes the YAML parser throw and
    # takes the whole forum API down with a 500. Found exactly that way.
    #
    # The operator declares which files and which keys are reachable, in the
    # agent's own config on the game host. There is deliberately no file
    # browser: on a machine that runs a start script, arbitrary write access is
    # arbitrary code execution.
    config:
      title: Server settings
      load: Load settings
      none: This server has no settings files set up. They are declared in the agent's config file on the game host.
      file_empty: There is nothing in this file.
      read_only: These settings can be read but not changed.
      locked: This one cannot be changed from here.
      save: Save

    # 🚨 `playing`, NOT `players` — `forum.players` is already the player COUNT
    # used on the cards, and a second `players:` under the same parent is a
    # duplicate key, which makes the YAML parser throw and takes the whole
    # forum API down with a 500. Caught by the duplicate-key check rather than
    # by a customer, which is the second time that check has paid for itself
    # today.
    #
    # The thing a forum can do that a standalone game panel cannot: the people
    # in this list are often the people reading the page.
    playing:
      title: "{count, plural, one {# player} other {# players}} in the game"
      nobody: Nobody is playing right now.

    # 🚨 Built from translated units, not the English letters "h" and "m",
    # because this string appears next to somebody's name on their own profile.
    duration:
      minutes: "{count, plural, one {# minute} other {# minutes}}"
      hours: "{count, plural, one {# hour} other {# hours}}"
      both: "{hours}h {minutes}m"

    profile:
      title: In the games

    board:
      title: Most time played
      online: Playing right now

    # 🚨 Proved in the GAME, not asserted on the forum. A form that believes
    # whatever somebody types lets anybody claim the community's best-known
    # player and inherit their playtime and rank.
    link:
      title: Your in-game account
      # 🚨 Says out loud that the link is PUBLIC. Somebody choosing to connect
      # their forum account to a character deserves to know it will appear on
      # their profile and on the server's leaderboard before they do it, not
      # after.
      explain: Link your forum account to your character, so your playtime counts here. Join the server, type your in-game name below, and Garrison will send you a code in the game. Your character will be shown on your profile.
      name_placeholder: Your name in the game
      send_code: Send me a code
      check_the_game: Garrison has sent a code to that player in the game. Read it there and type it below.
      code_placeholder: The code from the game
      confirm: That's me
      start_over: Use a different name
      linked: "You are linked to {player} on this server."
      unlink: Unlink

    backups:
      title: Backups
      create: Back up now
      none: No backups yet. One will appear here after the next backup runs.
      # 🚨 Said plainly, because this is the label on the one archive somebody
      # is most likely to want and least likely to recognise — taken
      # automatically, seconds before a world was overwritten.
      safety: Taken automatically before a restore
      restore: Restore
      delete: Delete
      cancel: Cancel
      # 🚨 The second sentence is the reason somebody can press the button at
      # all. Without it this is "overwrite your world, are you sure?", which is
      # a question nobody can answer confidently.
      confirm_restore: This replaces what is on the server right now with this backup. A copy of the current state is taken first, so this can be undone.
      # 🚨 Said before the click, not after. The agent refuses to restore into
      # a running server — correctly, because writing a world file under a live
      # process corrupts it — and a panel that only reports that afterwards has
      # left somebody stranded on the control they were most nervous about.
      confirm_restore_stops: This server is running, so it will be stopped first. It is left stopped afterwards, so you can check the restore before letting players back in.
      confirm_restore_do: Yes, restore it
      confirm_restore_do_stopping: Stop it and restore
      confirm_delete: This deletes the backup from the host. It cannot be undone.
      confirm_delete_do: Yes, delete it
      # 🚨 Configured on the game host, not here — the bucket keys never reach
      # the forum, which is the part of this system most likely to be
      # compromised. The panel says where copies go and whether they arrive.
      offsite:
        none: Backups are kept on the game host only. Copies to off-site storage are set up in the agent's config file.
        ok: "Also copied to {bucket} — last copy {when}."
        unknown: "Also copied to {bucket}. Nothing has been copied since this agent last started."
        failing: "Copies to {bucket} are failing."

      step:
        stopping: Stopping the server…
        restoring: Restoring…

      outcome:
        done_create: Backup taken.
        done_restore: Restored. A copy of the previous state was saved first.
        done_delete: Backup deleted.
        failed_create: The backup did not run.
        failed_restore: Nothing was restored.
        failed_delete: The backup was not deleted.
        # A stop that failed, so the restore was never attempted.
        done_stop: Server stopped.
        failed_stop: The server would not stop, so nothing was restored.
        waiting_stop: Still stopping.
        # 🚨 "We stopped watching" is a different and more honest thing to say
        # than "it failed" — the command may still be running on the host.
        waiting_create: Still working. The backup is running on the host.
        waiting_restore: Still working. The restore is running on the host.
        waiting_delete: Still working.

  admin:
    title: Garrison
    alerts: Alerts
    webhook: Discord or webhook address
    webhook_help: Posted to when a server stops accepting players, and again when it comes back. A Discord webhook address is detected automatically; anything else receives JSON.
    load_failed: Could not load Garrison's state.

    # 🚨 The wording matters more than usual here. This is Garrison reporting
    # on the two pieces of forum machinery it completely depends on and does
    # not own — and an operator reading "stalled" needs to know what it costs
    # them and what to do, not a status word they have to go and research.
    #
    # Two separate verdicts on purpose: the fixes are a cron entry and a worker
    # process, and one combined message would send somebody to the wrong one.
    machinery:
      last: "Last confirmed {when}"
      scheduler:
        ok: Garrison is running its checks.
        stalled: Garrison is not running.
        unknown: Garrison has not run a check yet.
        # 🚨 The most consequential sentence in this file. A forum without this
        # cron entry runs NOTHING — no health checks, no restarts, no backups,
        # no schedules, no alerts — and looks entirely normal while doing so.
        stalled_help: "Nothing has run Garrison's checks for a while, so no server is being watched, restarted or backed up. Flarum's scheduler is what runs them, and it needs this in the server's crontab: * * * * * php /path/to/forum/flarum schedule:run"
      queue:
        ok: Alerts are getting through.
        stalled: Alerts are not getting through.
        unknown: Garrison has not checked whether alerts are getting through yet.
        stalled_help: Garrison sends alerts as background jobs, and nothing on this forum has run one for a while — so a server going down would be recorded here and nobody would be told. This is usually a queue worker that has stopped; restarting it is the fix.

    # 🚨 Day toggles and a clock, never a cron field. The operator most likely
    # to want a nightly restart is the one least likely to write `0 5 * * *`
    # correctly — and a cron expression that is subtly wrong does not error, it
    # simply never fires while sitting in the panel looking configured.
    schedules:
      title: Scheduled
      add: Add a schedule
      none: Nothing scheduled. Add a nightly restart, a backup, or a message to players.
      remove: Remove this schedule
      remove_confirm: Remove this schedule?
      kind:
        restart: Restart
        backup: Back up
        console: Send to console
      day:
        mon: Mon
        tue: Tue
        wed: Wed
        thu: Thu
        fri: Fri
        sat: Sat
        sun: Sun
      when:
        every_day: every day
        weekdays: weekdays
      summary: "{what}, {when} at {time} ({zone})"
      line: Command to send
      line_placeholder: "say Server saving…"
      # 🚨 This field is the difference between a restart and an outage.
      # Players who are told finish what they are doing and log out; players
      # who are not lose whatever they were in the middle of and blame the
      # server.
      warn: Warn players this many minutes beforehand
      warn_line: What to tell them
      warn_line_placeholder: "say Restarting in 15 minutes — finish up and log out"

    # 🚨 A member can unlink their own character. This is for the case an
    # operator actually gets asked about: somebody who linked a character, left
    # the community, and whose in-game name the next player now has.
    # 🚨 The forum picks a template and names the server. The install
    # directory, start command, driver and Steam app id all come from the
    # agent's own config file on the game host — there is deliberately no field
    # here for a path or a command.
    provision:
      load: Install a new server
      none: This host has no install templates. They are declared in the agent's config file.
      choose: Choose what to install
      from_steam: downloads from Steam
      id_placeholder: A short id, like valheim-2
      name_placeholder: What to call it
      install: Install
      started: "Installing {id}. It appears here when it is ready; the download can take a while, and the progress is in that server's console."
      failed: The install could not be started.
      no_answer: The host has not answered yet. It may still be working.
      needs_a_server: This host has no servers yet, so there is nothing to send the request through. Add the first one to the agent's config by hand.

    identities: Linked accounts
    no_identities: Nobody has linked a forum account to an in-game character yet.
    identity_pending: Waiting for their code
    # Names what SURVIVES, because "unlink" reads like it might delete the
    # playtime too — and an operator who believes that will not press it.
    identity_unlink_confirm: "Unlink {player}? Their time played stays on the server's leaderboard; only the connection to a forum account is removed."
    identity_unlink: Unlink

    hosts: Game hosts
    no_hosts: No hosts paired yet. Give one a name and pair it, then put the token in that host's agent config.
    host_name_placeholder: A name for the host
    pair: Pair a host
    unpair: Unpair
    unpair_confirm: "Unpair {name}? Its {count} server(s) will disappear from the forum until it is paired again."
    host_seen: "Last heard from {when}"
    host_late: "⚠ Silent since {when}"
    host_never: Has never checked in

    token_heading: "{name} is paired"
    token_once: This token is shown once and is stored nowhere. Copy it now — if you lose it you will have to unpair and pair again.
    token_next: Put it in the host's agent config as the token, then start the agent.
    token_copied: I have copied it

    servers: Servers
    field_name: Name
    field_join_address: Address
    field_join_password: Password
    field_join_code: Join code
    public: Show this server to everyone, including guests
    auto_remediate: Restart this server automatically when it stops accepting players
    attention: Garrison stopped trying to restart this server. It needs looking at.
    clear_attention: I have looked — resume automatic restarts
    backup_every: Back up automatically, every (hours)
    backup_every_help: Zero means no automatic backups. The agent keeps the most recent copies and never deletes a safety copy taken before a restore.
    icon: Server image
    icon_help: PNG, JPEG, GIF or WebP, up to 512 KB. Uploaded and kept here, so it cannot disappear later.
    fetch_logo: Fetch the real logo
    fetch_logo_help: Downloads the game's own logo and keeps a copy on this forum. Not a hotlink — it cannot break later.
    logo_url: Or paste an image address
    logo_url_help: For games Garrison does not know, paste a link to the logo. It is downloaded and kept here, so it cannot break later.
    fetch: Fetch

    incidents: Recent incidents
    no_incidents: Nothing has gone wrong yet.

    permissions:
      # 🚨 Worded so the grid says what each one actually does. "View game
      # servers" would be a lie: a public server is visible to everyone
      # without any permission at all.
      view: See servers that are not marked public
      control: Start, stop and restart servers
      console: Send commands to a game console
      # 🚨 Separate from control on purpose. A community that wants a moderator
      # updating the message of the day should not have to hand them the
      # ability to restart during a raid, and the reverse is just as true.
      config: Read and change server settings
      manage: Manage Garrison, pair hosts, see everything
